name: Build Manhunt

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derle
        run: mvn -B clean package

      - name: Jar icinde kod var mi kontrol et
        run: |
          ls -l target/Manhunt.jar
          unzip -l target/Manhunt.jar | grep 'com/manhunt/ManhuntPlugin.class'
          unzip -l target/Manhunt.jar | grep 'plugin.yml'

      - name: Jar'i yukle
        uses: actions/upload-artifact@v4
        with:
          name: Manhunt
          path: target/Manhunt.jar
